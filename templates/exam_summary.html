<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Итоги экзамена</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="border: 2px solid var(--accent-color);">
        <h1>Экзамен сдан!</h1>
        <div class="stats-card" style="text-align: center; margin-top: 20px;">
            <h3>Твой результат:</h3>
            <p style="font-size: 24px;"><strong>{{ score }} из {{ total }}</strong></p>
        </div>
        <p class="subtitle">Задачи из экзамена не сдвинули твой график повторений (SM-2).</p>
        <a href="/" class="btn primary">Вернуться на главную</a>
    </div>
</body>
</html>
