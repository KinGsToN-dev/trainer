<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Настройки экзамена</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="border: 2px solid var(--accent-color);">
        <h1 style="color: var(--accent-color);">Экзамен</h1>
        <p class="subtitle">Выбери параметры проверки знаний</p>
        
        <form action="/start_exam" method="POST">
            <label for="limit">Количество вопросов:</label>
            <select name="limit" id="limit">
                <option value="5">5 вопросов</option>
                <option value="10">10 вопросов</option>
                <option value="20" selected>20 вопросов</option>
                <option value="50">50 вопросов</option>
            </select>

            <label for="difficulty">Сложность:</label>
            <select name="difficulty" id="difficulty">
                <option value="all">Любая</option>
                {% for d in difficulties %}
                    <option value="{{ d }}">{{ d }}</option>
                {% endfor %}
            </select>

            <button type="submit" class="btn primary" style="background-color: var(--accent-color); color: black;">Начать экзамен</button>
        </form>
        
        <a href="/" class="btn secondary" style="margin-top: 15px;">Назад</a>
    </div>
</body>
</html>
